name: Claude PR Review (static)
run-name: Claude static review of PR #${{ github.event.issue.number }}

# ---------------------------------------------------------------------------
# On-demand static Claude Code review that runs on a GitHub-hosted CPU runner.
# It never claims a Spyre card, so it can start independently of accelerator CI.
# ---------------------------------------------------------------------------
on:
  issue_comment:
    types: [created]

concurrency:
  # Keep static reviews for one PR serialized without sharing the hardware
  # review's group, which would make this job wait behind a Spyre run.
  group: claude-review-static-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  review:
    # The exact command prevents this workflow from matching /claude-review
    # while permitting a short explanatory suffix after the static command.
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/claude-review-static' || startsWith(github.event.comment.body, '/claude-review-static ')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # author_association is only a pre-filter; verify the actor's repository
      # permission before performing a review that can write PR comments.
      - name: Verify commenter has write access
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          perm="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission" \
            | grep -oP '"permission":\s*"\K[^"]+')"
          echo "Commenter ${ACTOR} has permission: ${perm:-<none>}"
          case "${perm}" in
            admin|write) echo "Authorized." ;;
            *) echo "::error::${ACTOR} lacks write access (${perm:-none}); refusing review." ; exit 1 ;;
          esac

      - name: Acknowledge trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -d '{"content":"eyes"}' \
            || echo "::warning::Could not add :eyes: reaction to the trigger comment"

      # Checkout the trusted default branch. /code-review retrieves the PR diff
      # through gh rather than executing untrusted PR code in this workflow.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI
        env:
          DISABLE_AUTOUPDATER: '1'
        run: |
          export HOME="${RUNNER_TEMP}/claude-home"
          mkdir -p "$HOME"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude review
        id: claude
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          API_TIMEOUT_MS: '1200000'
          GH_TOKEN: ${{ github.token }}
          SPYRE_KB_MCP_URL: ${{ secrets.SPYRE_KB_MCP_URL }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          export HOME="${RUNNER_TEMP}/claude-home"
          mcp_config="{\"mcpServers\":{\"spyre-knowledgebase\":{\"type\":\"http\",\"url\":\"${SPYRE_KB_MCP_URL}\"}}}"
          prompt="$(sed "s/__PR_NUMBER__/${PR_NUMBER}/" .github/claude-review-static-prompt.txt)"
          claude -p "$prompt" \
            --model claude-opus-4-8 \
            --max-turns 60 \
            --mcp-config "$mcp_config" \
            --strict-mcp-config \
            --allowedTools "Read,Grep,Glob,Bash,mcp__spyre-knowledgebase" \
            --output-format text

      - name: React with review outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REVIEW_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          if [ "$REVIEW_OUTCOME" = "success" ]; then reaction="+1"; else reaction="-1"; fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -d "{\"content\":\"${reaction}\"}" \
            || echo "::warning::Could not add the outcome reaction to the trigger comment"
