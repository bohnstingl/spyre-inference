name: uv.lock change notice

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notice:
    name: uv.lock change notice
    runs-on: ubuntu-latest
    steps:
      - name: Comment when uv.lock is modified
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const MARKER = '<!-- uv-lock-notice:';

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            const lock = files.find(f => f.filename === 'uv.lock');
            const projChanged = files.some(f => f.filename === 'pyproject.toml');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const prior = [...comments].reverse().find(c => c.body && c.body.includes(MARKER));
            const was = prior
              ? (prior.body.match(/<!-- uv-lock-notice:(touched|clear) -->/) || [])[1]
              : null;
            const now = lock ? 'touched' : 'clear';

            // Edge-triggered: only speak when the state flips. Nothing to clear if
            // the lock was never flagged on this PR.
            if (now === was || (!prior && now === 'clear')) {
              core.info(`uv.lock ${now}, already reported as ${was ?? 'unreported'}; no comment.`);
              return;
            }

            const tag = `${MARKER}${now} -->`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const body = now === 'clear'
              ? [
                  tag,
                  `✅ \`uv.lock\` is untouched again as of \`${sha}\` — nothing to confirm.`,
                ].join('\n')
              : [
                  tag,
                  '### 🔒 This PR modifies `uv.lock`',
                  '',
                  `\`+${lock.additions} −${lock.deletions}\` as of \`${sha}\`. ` + (projChanged
                    ? '`pyproject.toml` changed in this PR as well.'
                    : '**`pyproject.toml` is unchanged**, which usually means a local ' +
                      '`uv lock` or `uv sync` swept this in unintentionally.'),
                  '',
                  '`uv.lock` pins the entire dependency stack — including the `torch-spyre`',
                  'and `vllm` commits every CI runner builds against — so an unintended',
                  're-resolve silently changes what the whole test matrix installs.',
                  '',
                  '**Please confirm in a reply:**',
                  '',
                  `- ✅ **Intentional** (a dependency bump, or a deliberate \`pyproject.toml\` change) — say so here.`,
                  '- ↩️ **Not intentional** — drop the change:',
                  '',
                  '  ```bash',
                  '  git fetch https://github.com/torch-spyre/spyre-inference main',
                  '  git checkout FETCH_HEAD -- uv.lock',
                  '  git commit -m "chore: restore uv.lock"',
                  '  ```',
                  '',
                  '<sub>Checked on every push. A follow-up comment confirms it once the',
                  'change is reverted.</sub>',
                ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: pull_number, body,
            });
            core.info(`uv.lock ${was ?? 'unreported'} -> ${now}; commented on #${pull_number}.`);
